<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plantation Financial Model - CPO Report Preview</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body{margin:0;background:#f4f7fa;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10263c}

</head>
<body>
  <main class="preview-shell">
    <article class="panel">
      <div class="panel-header">
        <span class="status">Local cache</span>
        <p class="eyebrow">Public Data</p>
        <h2>Initial Workbook Migration</h2>
      </div>
      <div class="placeholder">
        <p>This local placeholder is replaced by the CPO report widget.</p>
      </div>
    </article>
  </main>
  <script src="/market-cpo-widget.js"></script>
</body>
</html>
